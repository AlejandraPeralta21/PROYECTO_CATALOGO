  <!-- jQuery para las validaciones y efectos solicitados en la guía de clase -->
  <script src="vendor/jquery-3.7.1.min.js"></script>

  <script>
    // Apply saved theme before first paint to prevent theme flash
    (function () {
      try {
        var saved = localStorage.getItem('planet_chicken_theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    // Detect mobile/tablet devices while CSS media queries handle the layout.
    (function () {
      var mobileAgent = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      function updateDeviceMode() {
        var isMobile = window.matchMedia('(max-width: 768px)').matches || mobileAgent;
        document.documentElement.dataset.deviceMode = isMobile ? 'mobile' : 'desktop';
      }
      updateDeviceMode();
      window.addEventListener('resize', updateDeviceMode, { passive: true });
    })();
  </script>
</head>
